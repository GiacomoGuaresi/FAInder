name: CI

on:
  pull_request:
  push:
    branches: [main]
    paths-ignore:
      - "data/**"

permissions:
  contents: read

jobs:
  app:
    name: Lint, typecheck, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test

  scraper:
    name: Data script tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install requests pytest
      - run: python -m pytest scripts
